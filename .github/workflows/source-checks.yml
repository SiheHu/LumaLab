name: Source and Shared Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-publication.py
  shared-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift run -c release LumaCoreChecks
